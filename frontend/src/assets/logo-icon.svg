<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Abstract rocket / upward-launch symbol with connected nodes -->
  <!-- Represents innovation, teamwork, and technology -->

  <!-- Background rounded square -->
  <rect width="48" height="48" rx="12" fill="#3730A3"/>

  <!-- Central upward arrow / rocket body -->
  <path d="M24 8 C24 8 18 16 18 24 C18 28.5 20.5 32 24 34 C27.5 32 30 28.5 30 24 C30 16 24 8 24 8Z" fill="white" opacity="0.95"/>

  <!-- Rocket tip / flame -->
  <path d="M24 34 C22.5 36 21.5 38 21.5 39.5 C21.5 41 22.6 42 24 42 C25.4 42 26.5 41 26.5 39.5 C26.5 38 25.5 36 24 34Z" fill="#818CF8" opacity="0.9"/>

  <!-- Left fin / connection node -->
  <circle cx="15" cy="28" r="3" fill="white" opacity="0.7"/>
  <line x1="18" y1="27" x2="21" y2="25" stroke="white" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>

  <!-- Right fin / connection node -->
  <circle cx="33" cy="28" r="3" fill="white" opacity="0.7"/>
  <line x1="30" y1="27" x2="27" y2="25" stroke="white" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>

  <!-- Top sparkle -->
  <circle cx="24" cy="12" r="1.5" fill="#C7D2FE"/>

  <!-- Connection line between nodes (collaboration) -->
  <line x1="15" y1="28" x2="33" y2="28" stroke="white" stroke-width="1" opacity="0.25" stroke-linecap="round" stroke-dasharray="2 3"/>
</svg>

