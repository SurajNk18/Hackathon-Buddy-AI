<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5eead4;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f0826;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0.06"/>
    </linearGradient>
    <filter id="ds1" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#7c3aed" flood-opacity="0.18"/>
    </filter>
    <filter id="ds2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2dd4bf" flood-opacity="0.15"/>
    </filter>
    <filter id="ds3" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient background glows -->
  <ellipse cx="310" cy="260" rx="280" ry="240" fill="url(#g4)" opacity="0.5"/>
  <circle cx="460" cy="130" r="90" fill="#7c3aed" opacity="0.04"/>
  <circle cx="140" cy="400" r="70" fill="#2dd4bf" opacity="0.04"/>

  <!-- ═══ MAIN LAPTOP ═══ -->
  <g filter="ds1">
    <!-- Laptop stand -->
    <path d="M190 385 L430 385 L455 405 Q460 410 455 410 L165 410 Q160 410 165 405 Z" fill="#2d2466" opacity="0.9"/>
    <rect x="290" y="380" width="40" height="10" rx="3" fill="#3b2d80"/>
    
    <!-- Screen shell -->
    <rect x="175" y="145" width="270" height="238" rx="14" fill="#1a1640" stroke="#4c1d95" stroke-width="1.2"/>
    
    <!-- Screen bezel top -->
    <circle cx="310" cy="156" r="3" fill="#3b2d80"/>
    
    <!-- Screen inner area -->
    <rect x="188" y="164" width="244" height="206" rx="6" fill="url(#g3)"/>
    
    <!-- ── IDE / Code Editor on screen ── -->
    <!-- Sidebar -->
    <rect x="188" y="164" width="48" height="206" rx="6" fill="#140f30"/>
    <rect x="196" y="178" width="32" height="4" rx="2" fill="#7c3aed" opacity="0.5"/>
    <rect x="196" y="190" width="24" height="4" rx="2" fill="#a78bfa" opacity="0.3"/>
    <rect x="196" y="202" width="28" height="4" rx="2" fill="#a78bfa" opacity="0.3"/>
    <rect x="196" y="214" width="20" height="4" rx="2" fill="#2dd4bf" opacity="0.3"/>
    <rect x="196" y="226" width="32" height="4" rx="2" fill="#a78bfa" opacity="0.2"/>
    <rect x="196" y="238" width="26" height="4" rx="2" fill="#a78bfa" opacity="0.25"/>
    
    <!-- Tab bar -->
    <rect x="236" y="164" width="196" height="18" fill="#140f30"/>
    <rect x="240" y="168" width="50" height="10" rx="3" fill="#1e1b4b"/>
    <rect x="294" y="168" width="50" height="10" rx="3" fill="#7c3aed" opacity="0.2"/>
    <rect x="348" y="168" width="40" height="10" rx="3" fill="#1e1b4b"/>
    
    <!-- Code lines -->
    <rect x="248" y="192" width="70" height="5" rx="2.5" fill="#7c3aed" opacity="0.6"/>
    <rect x="248" y="204" width="120" height="5" rx="2.5" fill="#a78bfa" opacity="0.35"/>
    <rect x="260" y="216" width="90" height="5" rx="2.5" fill="#2dd4bf" opacity="0.45"/>
    <rect x="260" y="228" width="60" height="5" rx="2.5" fill="#e2e8f0" opacity="0.2"/>
    <rect x="260" y="240" width="100" height="5" rx="2.5" fill="#7c3aed" opacity="0.3"/>
    <rect x="248" y="252" width="50" height="5" rx="2.5" fill="#a78bfa" opacity="0.25"/>
    <rect x="248" y="264" width="130" height="5" rx="2.5" fill="#2dd4bf" opacity="0.3"/>
    <rect x="260" y="276" width="80" height="5" rx="2.5" fill="#e2e8f0" opacity="0.15"/>
    <rect x="248" y="288" width="40" height="5" rx="2.5" fill="#7c3aed" opacity="0.35"/>
    
    <!-- Line numbers -->
    <text x="240" y="196" font-family="monospace" font-size="6" fill="#4c1d95" opacity="0.6">1</text>
    <text x="240" y="208" font-family="monospace" font-size="6" fill="#4c1d95" opacity="0.6">2</text>
    <text x="240" y="220" font-family="monospace" font-size="6" fill="#4c1d95" opacity="0.6">3</text>
    <text x="240" y="232" font-family="monospace" font-size="6" fill="#4c1d95" opacity="0.6">4</text>
    <text x="240" y="244" font-family="monospace" font-size="6" fill="#4c1d95" opacity="0.6">5</text>
    
    <!-- Terminal cursor -->
    <rect x="248" y="302" width="7" height="13" rx="1" fill="#2dd4bf" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Right mini-panel (dashboard) -->
    <rect x="385" y="192" width="42" height="60" rx="5" fill="#1a1640" stroke="#312e81" stroke-width="0.5"/>
    <!-- Mini donut chart -->
    <circle cx="406" cy="212" r="10" fill="none" stroke="#312e81" stroke-width="3"/>
    <circle cx="406" cy="212" r="10" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="22 41" stroke-linecap="round" transform="rotate(-90 406 212)"/>
    <circle cx="406" cy="212" r="10" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="12 51" stroke-linecap="round" transform="rotate(35 406 212)"/>
    <rect x="392" y="230" width="28" height="3" rx="1.5" fill="#a78bfa" opacity="0.3"/>
    <rect x="392" y="238" width="20" height="3" rx="1.5" fill="#2dd4bf" opacity="0.25"/>
    
    <!-- Right mini-panel 2 (bar chart) -->
    <rect x="385" y="260" width="42" height="52" rx="5" fill="#1a1640" stroke="#312e81" stroke-width="0.5"/>
    <rect x="392" y="290" width="6" height="14" rx="1.5" fill="#7c3aed" opacity="0.7"/>
    <rect x="401" y="284" width="6" height="20" rx="1.5" fill="#a78bfa" opacity="0.6"/>
    <rect x="410" y="288" width="6" height="16" rx="1.5" fill="#2dd4bf" opacity="0.6"/>
  </g>

  <!-- ═══ FLOATING CARD: Team Matched (top-right) ═══ -->
  <g filter="ds3">
    <g>
      <rect x="435" y="75" width="155" height="95" rx="14" fill="#1e1b4b" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
      <!-- Three connected avatars -->
      <circle cx="462" cy="108" r="14" fill="url(#g1)"/>
      <text x="458" y="113" font-family="Inter,system-ui,sans-serif" font-size="12" fill="white" font-weight="700">S</text>
      <circle cx="488" cy="108" r="14" fill="#3b2d80"/>
      <text x="484" y="113" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#c4b5fd" font-weight="700">R</text>
      <circle cx="514" cy="108" r="14" fill="url(#g2)" opacity="0.85"/>
      <text x="510" y="113" font-family="Inter,system-ui,sans-serif" font-size="12" fill="white" font-weight="700">A</text>
      <!-- Connection arcs -->
      <path d="M474 104 Q480 96 488 104" stroke="#a78bfa" stroke-width="1.2" fill="none" opacity="0.4"/>
      <path d="M500 104 Q506 96 514 104" stroke="#2dd4bf" stroke-width="1.2" fill="none" opacity="0.4"/>
      <!-- Match indicator -->
      <circle cx="555" cy="100" r="16" fill="rgba(45,212,191,0.12)"/>
      <path d="M548 100 L553 105 L563 95" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Label -->
      <text x="452" y="142" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#a78bfa" font-weight="600" letter-spacing="0.8">TEAM MATCHED</text>
      <text x="530" y="142" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#2dd4bf" font-weight="700">96%</text>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ═══ FLOATING CARD: AI Ideas (left) ═══ -->
  <g filter="ds2">
    <g>
      <rect x="28" y="175" width="135" height="88" rx="14" fill="#1e1b4b" stroke="rgba(45,212,191,0.3)" stroke-width="1"/>
      <!-- Lightbulb circle -->
      <circle cx="58" cy="210" r="18" fill="rgba(45,212,191,0.1)"/>
      <text x="48" y="217" font-size="22">💡</text>
      <!-- Text -->
      <text x="84" y="204" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#5eead4" font-weight="600" letter-spacing="0.5">AI IDEAS</text>
      <text x="84" y="220" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#f1f5f9" font-weight="700">3 Generated</text>
      <!-- Sparkle decorations -->
      <circle cx="140" cy="238" r="3" fill="#2dd4bf" opacity="0.5">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="128" cy="244" r="2" fill="#a78bfa" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="48" cy="240" r="2.5" fill="#7c3aed" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,7;0,0" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ═══ FLOATING CARD: Hackathon Trophy (bottom-right) ═══ -->
  <g filter="ds3">
    <g>
      <rect x="450" y="305" width="140" height="80" rx="14" fill="#1e1b4b" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
      <!-- Trophy -->
      <circle cx="482" cy="338" r="17" fill="rgba(251,191,36,0.08)"/>
      <text x="472" y="345" font-size="22">🏆</text>
      <!-- Text -->
      <text x="508" y="332" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#c4b5fd" font-weight="600" letter-spacing="0.5">HACKATHON</text>
      <text x="508" y="350" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#f1f5f9" font-weight="700">Winner!</text>
      <!-- Confetti dots -->
      <circle cx="565" cy="318" r="3" fill="#fbbf24" opacity="0.6">
        <animate attributeName="r" values="3;4.5;3" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="575" cy="328" r="2" fill="#2dd4bf" opacity="0.5"/>
      <circle cx="560" cy="366" r="2.5" fill="#a78bfa" opacity="0.4"/>
      <circle cx="470" cy="370" r="2" fill="#fbbf24" opacity="0.35"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="3.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ═══ FLOATING SKILL BADGE (bottom-left) ═══ -->
  <g filter="ds2">
    <g>
      <rect x="55" y="340" width="118" height="50" rx="12" fill="#1e1b4b" stroke="rgba(124,58,237,0.25)" stroke-width="1"/>
      <text x="70" y="362" font-size="16">⚡</text>
      <text x="92" y="358" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#a78bfa" font-weight="600" letter-spacing="0.5">SKILLS</text>
      <text x="92" y="374" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#f1f5f9" font-weight="700">React · Python</text>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,5;0,0" dur="4.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Subtle connecting dotted lines -->
  <line x1="163" y1="240" x2="188" y2="260" stroke="#7c3aed" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.15"/>
  <line x1="430" y1="230" x2="450" y2="320" stroke="#2dd4bf" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.12"/>
  <line x1="340" y1="145" x2="435" y2="105" stroke="#a78bfa" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.12"/>
  <line x1="175" y1="345" x2="190" y2="360" stroke="#7c3aed" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.1"/>

  <!-- Floating ambient particles -->
  <circle cx="95" cy="115" r="3.5" fill="#7c3aed" opacity="0.2">
    <animate attributeName="cy" values="115;105;115" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="220" r="3" fill="#2dd4bf" opacity="0.25">
    <animate attributeName="cy" values="220;210;220" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="290" r="2.5" fill="#a78bfa" opacity="0.2">
    <animate attributeName="cy" values="290;282;290" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="420" r="3" fill="#7c3aed" opacity="0.15">
    <animate attributeName="cy" values="420;412;420" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="310" cy="440" r="2.5" fill="#2dd4bf" opacity="0.15">
    <animate attributeName="cy" values="440;432;440" dur="4.5s" repeatCount="indefinite"/>
  </circle>
</svg>
